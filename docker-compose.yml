services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports: 
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - NODE_TLS_REJECT_UNAUTHORIZED='0'
    volumes:
      - ./n8n-data:/home/node/.n8n